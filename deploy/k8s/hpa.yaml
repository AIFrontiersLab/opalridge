apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: checkpoint-recovery-system
  namespace: checkpoint-recovery-system
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: checkpoint-recovery-system}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
